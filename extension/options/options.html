<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venster-Memory</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.12); --accent:#0071e3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e1e1e; --fg:#f5f5f7; --muted:#9a9a9e; --line:rgba(255,255,255,.14); --accent:#4da2ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:40px 24px; background:var(--bg); color:var(--fg);
           font:14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .note { color: var(--muted); margin: 0 0 28px; }
    .row { display:flex; align-items:flex-start; gap:10px; padding:14px 0; border-top:1px solid var(--line); }
    .row:last-of-type { border-bottom:1px solid var(--line); }
    .row label { flex:1; }
    .hint { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
    input[type=number] { width:88px; font:inherit; padding:4px 6px; border:1px solid var(--line);
                         border-radius:6px; background:transparent; color:var(--fg); }
    input[type=checkbox] { margin-top:3px; }
    footer { display:flex; align-items:center; gap:14px; margin-top:24px; }
    button { font:inherit; padding:6px 14px; border-radius:7px; border:1px solid var(--line);
             background:transparent; color:var(--fg); cursor:pointer; }
    button:hover { background: rgba(127,127,127,.12); }
    #saved { color: var(--accent); opacity: 0; transition: opacity .2s; }
    #saved.show { opacity: 1; }
  </style>
</head>
<body>
<main>
  <h1 data-i18n="optionsTitle"></h1>
  <p class="note" data-i18n="optionsProfileNote"></p>

  <div class="row">
    <input type="checkbox" id="enabled">
    <label for="enabled" data-i18n="optionsEnabled"></label>
  </div>
  <div class="row">
    <input type="checkbox" id="restoreOnFirstWindow">
    <label for="restoreOnFirstWindow" data-i18n="optionsFirstWindow"></label>
  </div>
  <div class="row">
    <input type="checkbox" id="restoreOnEveryNewWindow">
    <label for="restoreOnEveryNewWindow">
      <span data-i18n="optionsEveryWindow"></span>
      <span class="hint" data-i18n="optionsEveryWindowHint"></span>
    </label>
  </div>
  <div class="row">
    <label for="maxRemembered" data-i18n="optionsMax"></label>
    <input type="number" id="maxRemembered" min="1" max="200" step="1">
  </div>
  <div class="row">
    <label for="tabCreateDelayMs" data-i18n="optionsDelay"></label>
    <input type="number" id="tabCreateDelayMs" min="0" max="2000" step="10">
  </div>
  <div class="row">
    <label for="settleDelayMs">
      <span data-i18n="optionsSettle"></span>
      <span class="hint" data-i18n="optionsSettleHint"></span>
    </label>
    <input type="number" id="settleDelayMs" min="0" max="5000" step="50">
  </div>

  <footer>
    <button id="clear" data-i18n="optionsClear"></button>
    <span id="saved" data-i18n="optionsSaved"></span>
  </footer>
</main>
<script src="options.js"></script>
</body>
</html>
