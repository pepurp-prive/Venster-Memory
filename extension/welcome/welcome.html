<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venster-Memory</title>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73;
            --line:rgba(0,0,0,.12); --accent:#0071e3; --card:rgba(0,0,0,.035); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e1e1e; --fg:#f5f5f7; --muted:#9a9a9e; --line:rgba(255,255,255,.14);
              --accent:#4da2ff; --card:rgba(255,255,255,.06); }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:56px 24px; background:var(--bg); color:var(--fg);
           font:15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
    main { max-width: 620px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -0.01em; }
    .lead { color: var(--muted); margin: 0 0 32px; }
    ol { margin: 0 0 32px; padding: 0; list-style: none; counter-reset: step; }
    ol li { counter-increment: step; position: relative; padding: 14px 0 14px 44px; border-top: 1px solid var(--line); }
    ol li:last-child { border-bottom: 1px solid var(--line); }
    ol li::before {
      content: counter(step);
      position: absolute; left: 0; top: 13px;
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--card); color: var(--fg);
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .done { padding: 16px 18px; border-radius: 10px; background: var(--card); margin: 0 0 20px; }
    .aside { color: var(--muted); font-size: 13.5px; margin: 0; }
    .sidebar {
      font: 12.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--card); border-radius: 10px; padding: 14px 16px; margin: 0 0 20px;
      white-space: pre; overflow-x: auto;
    }
  </style>
</head>
<body>
<main>
  <h1 data-i18n="welcomeTitle"></h1>
  <p class="lead" data-i18n="welcomeIntro"></p>

  <ol>
    <li data-i18n="welcomeStep1"></li>
    <li data-i18n="welcomeStep2"></li>
    <li data-i18n="welcomeStep3"></li>
  </ol>

  <p class="done" data-i18n="welcomeDone"></p>

  <div class="sidebar">▸ Persoonlijk — 3 tabbladen     ←
  Persoonlijk tabbladgroepen
    Tijdelijk
    Naamloos
    Naamloos 1</div>

  <p class="aside" data-i18n="welcomeGroups"></p>
</main>
<script src="welcome.js"></script>
</body>
</html>
