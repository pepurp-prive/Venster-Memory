name: build app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test before packaging
        run: npm test

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find safari-web-extension-converter

      - name: Build the package
        run: ./scripts/make-app-package.sh

      - name: Work out the package name
        id: pkg
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Venster-Memory-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "loose=dist/Venster-Memory-extensie-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Check the bundle really contains the extension
        run: |
          set -euo pipefail
          STAGE="dist/Venster-Memory"
          APP="$STAGE/Venster Memory.app"
          APPEX="$(find "$APP/Contents/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          test -n "$APPEX" || { echo "no .appex inside the app"; exit 1; }
          test -f "$APPEX/Contents/Resources/manifest.json" || { echo "no manifest.json in the appex"; exit 1; }
          test -f "$APPEX/Contents/Resources/background.js" || { echo "no background.js in the appex"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Contents/Info.plist" \
            | grep -qx 'com.apple.Safari.web-extension'
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "architecturen: $(lipo -archs "$APP/Contents/MacOS/Venster Memory")"
          echo "minimaal macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          lipo -archs "$APP/Contents/MacOS/Venster Memory" | grep -q x86_64 || { echo "not universal"; exit 1; }

          # Unpacking the extension zip must land you straight on the folder
          # Safari's "Add Temporary Extension..." wants: manifest.json at the
          # root, no wrapper to descend into. Prove it by unpacking the zip that
          # actually ships, not the directory it was built from.
          CHECK="$(mktemp -d)"
          ditto -x -k "${{ steps.pkg.outputs.loose }}" "$CHECK"
          test "$(ls "$CHECK" | wc -l | tr -d ' ')" = 1 || { echo "extension zip has more than one top-level entry"; ls "$CHECK"; exit 1; }
          LOOSE="$CHECK/$(ls "$CHECK")"
          test -f "$LOOSE/manifest.json" || { echo "no manifest.json at the root of the extension zip"; exit 1; }
          test -f "$LOOSE/background.js" || { echo "extension zip is incomplete"; exit 1; }
          test ! -d "$LOOSE/Venster Memory.app" || { echo "the extension zip must not carry the app"; exit 1; }
          echo "extensie-zip pakt uit naar: $(basename "$LOOSE")/manifest.json"

          # The app, the extension and the zip must all claim the same version,
          # or a download looks like it might be the previous one.
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test "$APP_VERSION" = "${{ steps.pkg.outputs.version }}" \
            || { echo "app says $APP_VERSION, manifest says ${{ steps.pkg.outputs.version }}"; exit 1; }

          echo "OK: $(basename "$APPEX")"

      - uses: actions/upload-artifact@v4
        with:
          name: Venster-Memory-${{ steps.pkg.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.loose }}
          if-no-files-found: error

      - name: Note how it is signed
        run: |
          {
            echo "### Venster-Memory ${{ steps.pkg.outputs.version }}"
            echo
            echo "Ad-hoc gesigneerd, niet genotariseerd. In Safari is daarom"
            echo '**Ontwikkelaar → "Sta niet-ondertekende extensies toe"** nodig,'
            echo "en die zet Safari na elke herstart weer uit."
            echo
            echo "Het \`.command\` de eerste keer met rechtermuisknop → Open starten."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.pkg.outputs.zip }}" \
              "${{ steps.pkg.outputs.loose }}" --clobber
          else
            gh release create "$TAG" \
              "${{ steps.pkg.outputs.zip }}" \
              "${{ steps.pkg.outputs.loose }}" \
              --target "$GITHUB_SHA" \
              --title "Venster-Memory ${{ steps.pkg.outputs.version }}" \
              --notes-file packaging/RELEASE-NOTES.md
          fi
          echo "release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
