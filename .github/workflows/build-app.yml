name: build app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test before packaging
        run: npm test

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find safari-web-extension-converter

      - name: Build the package
        run: ./scripts/make-app-package.sh

      - name: Work out the package name
        id: pkg
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Venster-Memory-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Check the bundle really contains the extension
        run: |
          set -euo pipefail
          STAGE="dist/Venster-Memory"
          APP="$STAGE/Venster Memory.app"
          APPEX="$(find "$APP/Contents/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)"
          test -n "$APPEX" || { echo "no .appex inside the app"; exit 1; }
          test -f "$APPEX/Contents/Resources/manifest.json" || { echo "no manifest.json in the appex"; exit 1; }
          test -f "$APPEX/Contents/Resources/background.js" || { echo "no background.js in the appex"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Contents/Info.plist" \
            | grep -qx 'com.apple.Safari.web-extension'
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "architecturen: $(lipo -archs "$APP/Contents/MacOS/Venster Memory")"
          echo "minimaal macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          lipo -archs "$APP/Contents/MacOS/Venster Memory" | grep -q x86_64 || { echo "not universal"; exit 1; }

          # The folder Safari's "Add Temporary Extension..." expects must exist
          # and must have its manifest at the root, or picking it just gives
          # "Extensie niet ondersteund".
          LOOSE="$STAGE/Extensie-map (tijdelijk laden)"
          test -f "$LOOSE/manifest.json" || { echo "no loose extension folder"; exit 1; }
          test -f "$LOOSE/background.js" || { echo "loose folder is incomplete"; exit 1; }

          echo "OK: $(basename "$APPEX")"

      - uses: actions/upload-artifact@v4
        with:
          name: Venster-Memory-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      - name: Note how it is signed
        run: |
          {
            echo "### Venster-Memory ${{ steps.pkg.outputs.version }}"
            echo
            echo "Ad-hoc gesigneerd, niet genotariseerd. In Safari is daarom"
            echo '**Ontwikkelaar → "Sta niet-ondertekende extensies toe"** nodig,'
            echo "en die zet Safari na elke herstart weer uit."
            echo
            echo "Het \`.command\` de eerste keer met rechtermuisknop → Open starten."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" --clobber
          else
            gh release create "$TAG" "${{ steps.pkg.outputs.zip }}" \
              --target "$GITHUB_SHA" \
              --title "Venster-Memory ${{ steps.pkg.outputs.version }}" \
              --notes-file packaging/RELEASE-NOTES.md
          fi
          echo "release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
